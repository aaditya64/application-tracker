spring.application.name=application-tracker

# Local SQLite database file (created automatically on first run, gitignored).
spring.datasource.url=jdbc:sqlite:./data/tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Manually uploaded snapshot PDFs can be a few MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
